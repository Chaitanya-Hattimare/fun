<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        text-align: center;
        overflow-x: hidden;
        padding: 20px;
    }

    .box {
        background: white;
        color: #333;
        padding: 30px;
        border-radius: 20px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 10px 30px #0003;
    }

    h1 {
        font-size: 25px;
    }

    p {
        font-size: 17px;
    }

    button {
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        margin: 10px 5px;
    }

    #yes {
        background: #22c55e;
        color: white;
    }

    #no {
        background: #ef4444;
        color: white;
        position: relative;
    }

    #message {
        font-weight: bold;
        color: #764ba2;
        margin-top: 20px;
    }

    /* Photo is hidden initially */
    #photo {
        display: none;
        width: 100%;
        max-width: 280px;
        max-height: 350px;
        object-fit: contain;
        border-radius: 15px;
        margin: 20px auto 0;
        box-shadow: 0 5px 20px #0002;
        animation: popIn 0.6s ease;
    }

    @keyframes popIn {
        from {
            opacity: 0;
            transform: scale(0.5);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>

<div class="box">

    <h1>Will you be my gf? 😏</h1>

    <p>Choose your answer carefully! 👀❤️</p>

    <button id="yes" onclick="sayYes()">YES 😎</button>

    <button id="no" onmouseover="runAway()">NO 😂</button>

    <div id="message"></div>

    <!-- Replace photo.jpg with your photo's filename -->
    <img id="photo" src="new.jpg" alt="Your special photo">

</div>

<script>
    function sayYes() {
        document.getElementById("message").innerHTML =
            "Congratulations! You're officially my Bhondu gf! 🎉😂❤️";

        const photo = document.getElementById("photo");

        photo.style.display = "block";
    }

    function runAway() {
        const button = document.getElementById("no");

        button.style.position = "fixed";

        const maxX = window.innerWidth - button.offsetWidth;
        const maxY = window.innerHeight - button.offsetHeight;

        button.style.left =
            Math.random() * Math.max(0, maxX) + "px";

        button.style.top =
            Math.random() * Math.max(0, maxY) + "px";
    }
</script>
